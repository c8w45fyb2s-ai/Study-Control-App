name: Verify study flows

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Explicit SDK selection: macos-15 currently defaults to Xcode 16.4.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  behavior:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      STUDYCOMPANION_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Show build toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Verify local study and persistence flows
        run: |
          make BUILD_DIR="$RUNNER_TEMP/study-checks" \
            verify-active-recall \
            verify-merge-import \
            verify-data-layer \
            verify-ai-plan \
            verify-daily-plan \
            verify-integration \
            verify-document-evidence \
            verify-schedule-store

  builds:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=macOS
          - generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Show build toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build ${{ matrix.destination }}
        run: |
          xcodebuild \
            -project "study software.xcodeproj" \
            -scheme "study software" \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/StudyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
